# Canonical copy lives at ~/.tmux.conf (same contents; track one or symlink).
# See tmux/README.md

# ~/.tmux.conf — dev flow + Neovim (truecolor, focus events, vim-tmux-navigator)
# TPM: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm

# ── Core (Neovim-friendly) ─────────────────────────────────────────────────
set -sg escape-time 0
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g focus-events on
setw -g aggressive-resize on

# True color inside tmux (Neovim termguicolors / themes)
set -g default-terminal "tmux-256color"
set -as terminal-features ",tmux-256color:RGB"
set -as terminal-features ",xterm-256color:RGB"

# ── Prefix ─────────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# ── Panes / windows (stay in cwd) ─────────────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Prefix + hjkl — tmux-only navigation (when not using Ctrl+hjkl / Neovim)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Copy mode (vi) — Linux clipboard ───────────────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
# Wayland (default on many desktops); for X11 use: xclip -selection clipboard -i
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy -n"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "wl-copy -n"

# ── Appearance: Kitty ~/.config/kitty/kitty.conf One Dark + Neovim onedark ─
# Ref: background #282c34, foreground #abb2bf, selection #3e4451, cursor #528bff,
# blue #61afef, green #98c379, magenta #c678dd, cyan #56b6c2, bright black #545862
set -g status-position bottom
set -g status-interval 5
set -g status-justify absolute-centre
set -g status-style "bg=#21252b,fg=#abb2bf"

# Left: session pill (accent = Kitty cursor) → powerline into bar
set -g status-left-length 36
set -g status-left "#[fg=#282c34,bg=#528bff,bold] #S #[fg=#528bff,bg=#21252b,nobold]#[bg=#21252b,fg=#abb2bf] "

# Centre / windows: inactive vs active (active = Neovim “tab” blue)
setw -g window-status-style "bg=#21252b,fg=#545862"
setw -g window-status-format "#[fg=#3e4451,bg=#21252b]#[bg=#21252b,fg=#7f848e] #I #[fg=#3e4451]· #[fg=#abb2bf]#W "
setw -g window-status-current-style "bg=#61afef,fg=#282c34,bold"
setw -g window-status-current-format "#[fg=#21252b,bg=#61afef]#[fg=#282c34,bg=#61afef,bold] #I · #W #[fg=#61afef,bg=#21252b,nobold]"
setw -g window-status-separator ""

# Right: cwd (muted) + time (magenta) + date (cyan) — powerline caps
set -g status-right-length 100
set -g status-right "#[fg=#3e4451,bg=#21252b]#[fg=#abb2bf,bg=#3e4451] #{=40:pane_current_path} #[fg=#21252b,bg=#3e4451]#[fg=#c678dd,bg=#21252b,bold]%H:%M#[nobold]#[fg=#5c6370] · #[fg=#56b6c2]%d %b "

set -g pane-border-style "fg=#3e4451"
set -g pane-active-border-style "fg=#528bff"
set -g message-style "bg=#3e4451,fg=#abb2bf,bold"
set -g message-command-style "bg=#3e4451,fg=#61afef,bold"
setw -g mode-style "bg=#3e4451,fg=#abb2bf,bold"
set -g display-panes-colour "#545862"
set -g display-panes-active-colour "#528bff"

# ── TPM (keep run at bottom) ────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'

set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'

# Optional: don’t pass C-l into Neovim when you want shell redraw only (uncomment)
# set -g @vim_navigator_prefix_mapping_clear_screen 'C-S-l'

if-shell 'test -r ~/.tmux/plugins/tpm/tpm' 'run ~/.tmux/plugins/tpm/tpm'
